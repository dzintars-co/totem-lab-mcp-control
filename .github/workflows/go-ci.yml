name: Go and Arduino CI

'on':
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MCP server
            module: Projects/totem-mcp
            package: ./cmd/totem-mcp
            binary: totem-mcp
          - name: Codex event bridge
            module: Projects/totem-mcp/codex-bridge
            package: .
            binary: totem-codex-bridge
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.module }}
    env:
      CGO_ENABLED: '1'
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Test with race detector
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build -trimpath -buildvcs=false -o "$RUNNER_TEMP/${{ matrix.binary }}" "${{ matrix.package }}"

  firmware:
    name: Arduino firmware
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2.0.0
        with:
          version: '1.5.1'
      - name: Install AVR core on the CI runner
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr@1.8.8
      - name: Compile Arduino Uno firmware
        run: |
          arduino-cli compile --fqbn arduino:avr:uno \
            --build-path "$RUNNER_TEMP/totem-firmware" \
            Projects/totem-mcp/firmware/totem_uno
